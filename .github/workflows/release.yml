name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Attach the single-file app to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NetCanvas.html
          generate_release_notes: true
