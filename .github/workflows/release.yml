# Publishes a release when a version tag (v1.2.3) is pushed.
# The file is only published after the full CI suite passes on the tagged commit, and it ships with
# a SHA-256 checksum, a CycloneDX SBOM, third-party licence notices and a signed build-provenance
# attestation, so a plant can verify the copy it installs (see SECURITY.md).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag must match package.json version
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${{ github.ref_name }}" ] || { echo "Tag ${{ github.ref_name }} does not match package.json version $v"; exit 1; }
      - run: npm run build
      - name: Checksum
        working-directory: dist
        run: sha256sum NetworkCanvas.html | tee NetworkCanvas.html.sha256
      - name: Software bill of materials (CycloneDX)
        run: npx --yes @cyclonedx/cyclonedx-npm@7.0.0 --omit dev --output-file dist/NetworkCanvas.sbom.cdx.json
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/NetworkCanvas.html
      - name: Publish the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/NetworkCanvas.html
            dist/NetworkCanvas.html.sha256
            dist/NetworkCanvas.sbom.cdx.json
            dist/THIRD_PARTY_NOTICES.txt
          generate_release_notes: true
